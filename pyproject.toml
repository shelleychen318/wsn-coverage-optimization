[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wsn-coverage"
version = "0.1.0"
description = "Area coverage maximization under network connectivity in WSNs (PSO vs SQP)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["wsn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
